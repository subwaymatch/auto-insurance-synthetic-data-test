name: Release dataset

# Builds the dataset from source, tests and validates it, and publishes it as a GitHub release.
# The generated data is not committed to the repository; releases are where it lives.
#
#   * Every push to main that changes the generator rebuilds the rolling "latest" pre-release, so
#     .../releases/download/latest/chicago-auto-insurance-data-latest-csv.zip is always current.
#   * Push a tag such as v1.0.0 to publish a versioned release of the default configuration.
#   * Or run it from the Actions tab ("Run workflow") with a tag and, optionally, another seed, size or
#     set of file formats. Formats are defined in scripts/release_formats.py; add one there (and its
#     library to requirements-release.txt) to publish it.

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:                      # for pushes to main only; tag pushes always run
      - "autoins/**"
      - "reference/**"
      - "scripts/**"
      - "generate.py"
      - "validate.py"
      - "requirements*.txt"
      - "README.md"             # shipped inside the data zip
      - ".github/workflows/release.yml"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create, e.g. v1.1.0 (1.1.0 also works: the v is added)"
        required: true
        type: string
      seed:
        description: "Random seed"
        required: false
        default: "20250101"
        type: string
      policies:
        description: "Number of policies"
        required: false
        default: "51391"
        type: string
      formats:
        description: "File formats, comma-separated (see scripts/release_formats.py)"
        required: false
        default: "csv"
        type: string
      prerelease:
        description: "Mark as a pre-release"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && (startsWith(inputs.tag, 'v') && inputs.tag || format('v{0}', inputs.tag)) || (github.ref_type == 'tag' && github.ref_name || 'latest') }}
  # a newer push to main supersedes a rolling build still in progress; versioned releases always finish
  cancel-in-progress: ${{ github.event_name == 'push' && github.ref_type == 'branch' }}

defaults:
  run:
    shell: bash

env:
  ROLLING: ${{ github.event_name == 'push' && github.ref_type == 'branch' }}
  # a version typed without its leading v (1.1.0) is released as v1.1.0
  TAG: ${{ github.event_name == 'workflow_dispatch' && (startsWith(inputs.tag, 'v') && inputs.tag || format('v{0}', inputs.tag)) || (github.ref_type == 'tag' && github.ref_name || 'latest') }}
  SEED: ${{ inputs.seed || '20250101' }}
  POLICIES: ${{ inputs.policies || '51391' }}
  FORMATS: ${{ inputs.formats || 'csv' }}
  PRERELEASE: ${{ inputs.prerelease && 'true' || 'false' }}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check inputs
        run: |
          if [[ "$ROLLING" != "true" ]]; then
            [[ "$TAG" =~ ^v[0-9A-Za-z._-]+$ ]] || { echo "::error::Tag must look like v1.2.3 (got '$TAG')"; exit 1; }
          fi
          [[ "$SEED" =~ ^[0-9]+$ ]] || { echo "::error::Seed must be a whole number"; exit 1; }
          [[ "$POLICIES" =~ ^[0-9]+$ ]] && (( POLICIES >= 1000 && POLICIES <= 500000 )) \
            || { echo "::error::Policies must be between 1,000 and 500,000"; exit 1; }
          [[ "$FORMATS" =~ ^[a-z0-9]+(,[a-z0-9]+)*$ ]] || { echo "::error::Formats must look like csv or csv,parquet"; exit 1; }

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-release.txt

      - name: Run tests
        run: python -m unittest discover tests -v

      - name: Generate dataset
        run: python generate.py --seed "$SEED" --policies "$POLICIES" --out build/output

      - name: Validate dataset
        run: |
          set -o pipefail
          python validate.py --out build/output | tee build/validation.txt

      - name: Package release files
        run: >-
          python scripts/package_release.py --data build/output --tag "$TAG" --validation build/validation.txt
          --dist dist --formats "$FORMATS" --source "$GITHUB_SHA"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t files < <(find dist -maxdepth 1 -type f ! -name release_notes.md | sort)
          if [[ "$ROLLING" == "true" ]]; then
            # replace the rolling release (and move its tag) so it holds exactly this build's files
            gh release delete "$TAG" --cleanup-tag --yes 2>/dev/null || true
            gh release create "$TAG" "${files[@]}" --title "Latest build of main" --notes-file dist/release_notes.md \
              --target "$GITHUB_SHA" --prerelease
            exit 0
          fi
          flags=()
          [[ "$PRERELEASE" == "true" ]] && flags+=(--prerelease)
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists; replacing its files and notes."
            gh release upload "$TAG" "${files[@]}" --clobber
            gh release edit "$TAG" --notes-file dist/release_notes.md "${flags[@]}"
          else
            gh release create "$TAG" "${files[@]}" --title "Dataset $TAG" --notes-file dist/release_notes.md \
              --target "$GITHUB_SHA" "${flags[@]}"
          fi

      - name: Summary
        run: cat dist/release_notes.md >> "$GITHUB_STEP_SUMMARY"
