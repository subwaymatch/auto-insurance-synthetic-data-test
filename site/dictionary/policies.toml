[policy]
grain = "Policy"
summary = """One row for every policy in the data: the book already in force on January 1, 2022 and all new business written through the valuation date, December 31, 2026. Each row shows the policy at its latest status (on the valuation date if in force, otherwise on its last day of cover), so address, limits, homeowner status, named insured and the driver and vehicle counts are current values. Use `exposure` for what was in force on a past date and `policy_term` for each term."""

[policy.columns]
policy_id = "Primary key."
policy_number = "The policy number printed on documents: a seven-digit serial issued in the order policies were written, the underwriting company's code (`LFP`, `LFM` or `PPC`) and two check digits, for example `0830512-LFM-47`. Serials have gaps."
location_id = "The garaging ZIP code at the latest status. A household that moved shows only its latest address; `exposure.location_id` has the address in force on each date."
agency_id = "The agency that wrote the policy. Direct business points to one of the company's two direct units, `Direct - Online` or `Direct - Contact Center`."
producer_id = "The licensed agent at the agency who services the policy. Blank for direct business."
company_id = "The underwriting company the policy is placed with: Lakefront Preferred, Lakefront Mutual (standard) or Prairie Path Casualty (non-standard). Set when the policy is written, from its insurance score, driving record and prior insurance."
distribution_channel = "How the policy was sold: `Independent Agent`, `Exclusive Agent` or `Direct`."
original_inception_date = "The date the policy was first written. For policies in force on January 1, 2022 it can be decades earlier; for new business it equals `first_effective_date`."
first_effective_date = "The effective date of the policy's first term in the data. For policies in force on January 1, 2022 this is the term then running, so it falls on or before that date."
latest_expiration_date = "The end of the policy's cover: the expiration date of its latest term, or the cancellation date if it was canceled. For a policy in force it is after the valuation date."
term_months = "Term length in months: `6` or `12`."
policy_status = "Status on the valuation date: `In Force`, `Canceled` or `Non-Renewed`. A company non-renewal counts once its notice is sent, so a few `Non-Renewed` policies are still covered until a `latest_expiration_date` after the valuation date."
status_reason = "Why the policy ended. For `Canceled`: `Underwriting`, `Non-Payment`, `Insured Request` or `Insured Deceased`. For `Non-Renewed`: `Company Non-Renewal` or `Insured Did Not Renew`. Blank for policies in force."
cancel_date = "The date the cancellation took effect. Blank unless `policy_status` is `Canceled`."
named_insured_driver_id = "The current named insured. If the named insured dies and a spouse takes over the policy, this points to the spouse; the original named insured stays in `driver` as removed."
number_of_drivers = "Drivers on the policy at its latest status (the valuation date if in force, otherwise the last day of cover), counted from each driver's added and removed dates."
number_of_vehicles = "Vehicles on the policy at its latest status, counted the same way. It differs from `policy_term.vehicles_at_term_start` when a car was added or removed during the latest term."
homeowner = "`Y` if the named insured owns their home, at the latest status, otherwise `N`. It can change only when the household moves."
multi_policy = "`Y` if the household also holds another policy with the company (bundling), which earns the multi-policy discount, otherwise `N`. Fixed for the policy's life."
prior_insurance = "`Y` if the household had continuous insurance before the policy was written, otherwise `N`. Without it, liability, medical and collision premiums carry an 8% surcharge. Always `Y` for policies in force on January 1, 2022."
insurance_score = "The household's insurance score used in rating and company placement, from 350 to 900 (higher is better). Blank for a no-hit (no score available), which is rated as its own tier. Fixed for the policy's life."
payment_plan = "How the premium is paid: `Paid in Full`, `Monthly EFT` (monthly bank draft) or `Monthly Bill`. Fixed for the policy's life."
bi_limit = "Bodily injury liability limits at the latest status, in thousands of dollars per person / per accident: `25/50`, `50/100`, `100/300`, `250/500` or `500/500`. Limits can change at renewal; `exposure.bi_limit` has those in force on each date."
pd_limit = "Property damage liability limit in dollars at the latest status: `20000`, `50000`, `100000` or `250000`. It goes with the bodily injury option (`100/300` and `250/500` both carry `100000`)."
um_limit = "Uninsured/underinsured motorist bodily injury limits at the latest status, in thousands of dollars per person / per accident. Same values as `bi_limit` and never higher than it."
med_pay_limit = "Medical payments limit in dollars: `0` (no medical payments cover), `1000`, `2000`, `5000` or `10000`."

[policy_term]
grain = "Policy term (6 or 12 months)"
summary = """One row per policy term, from the term in force on January 1, 2022 (for policies already on the books) through every term that started by the valuation date. It holds each term's dates, its cancellation or non-renewal, and its premium: written at the start, endorsements, the return on cancellation, and premium earned before and inside the extract. Terms in force on January 1, 2022 began earlier, and only the part after that date counts in `earned_premium`."""

[policy_term.columns]
policy_term_id = "Primary key."
policy_id = "The policy the term belongs to."
term_number = "The term's place in the policy's history, counting from when it was first written (1 is the first term). Policies in force on January 1, 2022 often enter the data with a high number."
business_type = "`New` for a policy's first term (term number 1), `Renewal` for later terms. A few policies were still in their first term on January 1, 2022, so some `New` terms started before the extract."
effective_date = "First day of the term. A policy written on the 29th to 31st renews on the last day of a shorter month, then returns to its original day."
expiration_date = "Scheduled end of the term, which is the next term's effective date. A cancellation does not change it; see `cancel_date`."
offer_date = "Date the term was quoted: the renewal offer date, 30 to 45 days before a renewal on a business day, or the quote date, up to 14 days before new business."
rating_date = "Date the term was last rated, using only what was known that day. Equals `offer_date` unless the household changed between the offer and the effective date, in which case the renewal was re-rated on the day of the change."
cancel_date = "Date a cancellation took effect during the term. Blank if the term was not canceled. Only cancellations on or before the valuation date appear."
cancel_reason = "`Underwriting` (new business canceled in its first 60 days), `Non-Payment` (three to four weeks after a billed installment went unpaid), `Insured Request` (including a policy whose last car went with no replacement) or `Insured Deceased`. Blank if the term was not canceled."
nonrenewal_reason = "On the last term of a policy that did not renew: `Company Non-Renewal` or `Insured Did Not Renew`. Blank otherwise."
vehicles_at_term_start = "Vehicles on the policy on the term's effective date (0 if the term began while a replacement car was still to come). `policy.number_of_vehicles` is the count at the latest status instead."
written_premium = "Full-term premium in dollars for the vehicles on the policy at the term start, as rated on `rating_date`. For terms in force on January 1, 2022 it was written before the extract."
endorsement_premium = "Net premium in dollars added (positive) or returned (negative) by mid-term changes, pro rata to the end of the term. It excludes the premium returned on cancellation."
return_premium = "Premium in dollars returned when the term was canceled, as a negative number; 0 if it was not canceled."
earned_premium_before_extract = "Premium in dollars earned before January 1, 2022. Non-zero only for terms in force on that date."
earned_premium = "Premium in dollars earned from January 1, 2022 through the valuation date or the end of cover. For a finished term, written + endorsement + return premium equals the two earned columns added; a term still running also has unearned premium."
rate_level_index = "The company's filed rate level in force for the term's effective date, relative to January 1, 2022 (1.0). Terms effective earlier also show 1.0. It matches `rate_change.cumulative_rate_level`."

[premium_transaction]
grain = "Premium transaction"
summary = """The premium ledger: one row per new business, renewal, endorsement or cancellation, booked on its processed date as a policy system books it. A term's transactions add up to its written, endorsement and return premium in `policy_term`. Transactions processed after the valuation date are not included, and renewals are processed 30 to 45 days before they take effect, so for period totals use the later of `effective_date` and `processed_date` as the accounting date."""

[premium_transaction.columns]
transaction_id = "Primary key."
policy_id = "The policy the transaction belongs to."
policy_term_id = "The policy term the transaction belongs to."
transaction_type = "`New Business`, `Renewal`, `Endorsement` (a mid-term change) or `Cancellation`."
effective_date = "Date the transaction takes effect: the term's effective date for new business and renewals, the day of the change for an endorsement, and the cancellation date for a cancellation. Terms in force on January 1, 2022 have their renewal row dated earlier."
processed_date = "Date the transaction was booked: the term's rating date for new business and renewals (before they take effect), the day of the change or up to a week or two after it for endorsements, and the cancellation date or a few days after it for cancellations."
change_reason = "What an endorsement or cancellation was for. Endorsements list their changes, joined by `; ` when several fall on one day, for example `Address Change`, `Vehicle Added`, `Spouse Added` or `Vehicle Removed (Total Loss)`; cancellations give the cancellation reason. Blank for new business, renewals and the occasional endorsement with no recorded change."
written_premium = "Premium in dollars written by the transaction, signed: the full-term premium for new business and renewals, the pro rata amount added (positive) or returned (negative) for an endorsement, and the unearned premium returned (negative) for a cancellation."
commission_rate_pct = "The agency's commission rate in percent: its new-business rate (10 to 15) on every transaction of a policy's first term, its renewal rate (7 to 13) on later terms, and 0 for direct business."
commission_amount = "Commission in dollars on the transaction, `written_premium` times `commission_rate_pct` / 100. Negative when premium is returned, since the agency gives that commission back."

[quote]
grain = "New-business quote, bound or not"
summary = """One row per new-business quote given between January 1, 2022 and the valuation date, whether or not it became a policy. Bound quotes (`bound` = `Y`) describe the household as first quoted and link to the policy; unbound quotes come from prospects rated with the same plan. Policies already in force on January 1, 2022, and new business quoted before that date, have no quote row."""

[quote.columns]
quote_id = "Primary key."
quote_number = "The quote number given to the customer: `Q`, the two-digit year and a seven-digit sequence that restarts each year and has gaps, for example `Q24-0067681`."
quote_date = "Date the quote was given. Agents quote mostly on weekdays; the website quotes every day."
proposed_effective_date = "Requested start date of cover, 0 to 14 days after `quote_date`. For a bound quote it is the policy's `first_effective_date`."
distribution_channel = "How the quote came in: `Independent Agent`, `Exclusive Agent` or `Direct`."
agency_id = "The agency that gave the quote; for a direct quote, one of the company's two direct units."
location_id = "The garaging ZIP code quoted."
term_months = "Term length quoted: `6` or `12` months."
named_insured_age = "Age of the named insured in whole years on the proposed effective date."
number_of_drivers = "Drivers on the quote."
youngest_driver_age = "Age of the youngest driver on the quote in whole years, on the proposed effective date."
number_of_vehicles = "Vehicles on the quote."
prior_insurance = "`Y` if the prospect had continuous insurance before, otherwise `N`."
insurance_score = "The prospect's insurance score, from 350 to 900 (higher is better). Blank for a no-hit (no score available)."
bi_limit = "Bodily injury liability limits quoted, in thousands of dollars per person / per accident: `25/50`, `50/100`, `100/300`, `250/500` or `500/500`."
telematics_opt_in = "`Y` if the prospect agreed to join the DriveCheck telematics program, otherwise `N`. Those quotes carry the 5% participation discount, bound or not."
quoted_annual_premium = "The company's quoted premium in dollars, stated for a full year: a 6-month quote's premium is doubled. Adjust for term length before comparing with `policy_term.written_premium`."
competitor_annual_premium = "The best competing annual premium in dollars, as the agent's comparative rater showed it. Filled only for `Independent Agent` quotes; blank for the other channels."
bound = "`Y` if the quote became a policy, `N` if not."
policy_id = "The policy the quote became. Blank when `bound` is `N`."

[renewal_offer]
grain = "Renewal evaluated (renewed or not)"
summary = """One row for every renewal the company evaluated, renewed or not, from offers made late in 2021 for terms starting in 2022 through the valuation date. Everything is decided on the offer date from the policy as it stood that day, and both premiums are for the vehicles in force then for a full term, so they can differ from the written premium of the expiring and renewal terms. The answer key's `renewal_offer_truth` gives each offer's true chance of acceptance."""

[renewal_offer.columns]
renewal_offer_id = "Primary key."
policy_id = "The policy being renewed."
expiring_policy_term_id = "The policy term this renewal would replace."
offer_date = "Date the renewal was evaluated and the offer (or a non-renewal notice) sent, 30 to 45 days before `renewal_effective_date`, on a business day. It equals the renewal term's `offer_date`."
renewal_effective_date = "Date the renewal term would start: the expiring term's expiration date."
vehicles_offered = "Vehicles on the policy on the offer date (the expiring term's exposure rows in force that day)."
expiring_premium = "Full-term premium in dollars for the vehicles offered, at the expiring term's rates and rating. It differs from the expiring term's written premium when cars changed during that term."
renewal_premium = "Full-term premium in dollars offered for the same vehicles for the renewal term, as rated on the offer date (also calculated for company non-renewals). The renewal term's written premium can differ after a revised offer or a coverage change at renewal."
premium_change_pct = "Percent change from `expiring_premium` to `renewal_premium`, to one decimal (`-3.6` means 3.6% lower). Blank when `expiring_premium` is 0 because no vehicle was in force on the offer date."
telematics_opt_in = "Whether the policy joined the DriveCheck telematics program with this renewal: `Y` joined, `N` declined. Blank when it was not offered: the policy was already enrolled, had left the program within two years, or was being non-renewed."
underwriting_decision = "`Renew` or `Non-Renew`. The underwriting review flags drivers with two or more at-fault accidents, two or more major violations, or one of each, in the three years before the renewal and known by the offer date; half of those flagged get `Non-Renew`."
revised_offer_date = "Date the pending renewal was re-rated after a household change (a move, or a car or driver added or removed) between the offer date and the effective date. Blank if there was none. For a renewal that took effect it equals the renewal term's `rating_date`."
outcome = "`Renewed`, `Insured Did Not Renew`, `Company Non-Renewal`, `Canceled Before Renewal` (canceled between the offer and the renewal date) or `Pending` (renewal date after the valuation date, so the customer's decision is not yet known)."
renewal_policy_term_id = "The policy term the renewal created. Blank unless `outcome` is `Renewed`."

[customer_contact]
grain = "Contact with a policyholder (letter, email or phone call)"
summary = """One row per letter, email or phone call to a policyholder between January 1, 2022 and the valuation date. Each is tied to an event elsewhere in the data (a new policy, a renewal offer or non-renewal, a billing notice, a cancellation, a policy change or a claim), but only the policy, date, method and purpose are recorded, so match on `policy_id` and date to find the event."""

[customer_contact.columns]
contact_id = "Primary key."
contact_method = "`Email`, `Written Letter` or `Phone Call`. Paperless households (about six in ten) get email, others letters. `Notice of Non-Renewal`, `Notice of Cancellation` and `Cancellation for Non-Payment` always go by letter; some past-due notices and claim contacts are phone calls."
policy_id = "The policy the contact concerns."
contact_date = "Date of the contact. Letters and calls go out on business days (calls also on Saturdays), so they can fall a day or more after the event; emails go out any day."
purpose = "What the contact was about: `New Business Welcome`, `Policy Change Confirmation`, `Renewal Offer`, `Revised Renewal Offer`, `Notice of Non-Renewal`, `Past Due Notice`, `Notice of Cancellation`, `Returned Payment Notice`, `Cancellation for Non-Payment`, `Cancellation Confirmation`, `Claim Acknowledgment` or `Claim Closure Notice`. A `Notice of Cancellation` warns of cancellation for an unpaid bill and is withdrawn if the customer pays, so it does not mean the policy was canceled."

[driver]
grain = "Driver on a policy"
summary = """One row for every driver ever listed on a policy, including drivers who joined long before 2022 and drivers later removed; each driver belongs to one policy. Role, marital status and removal fields show the latest record, while `good_student`, `prior_violations` and `prior_accidents` are as of the day the driver was added. `exposure` has the characteristics each term was rated with, and `driver_incident` has the dated record."""

[driver.columns]
driver_id = "Primary key."
policy_id = "The policy the driver is listed on."
driver_number = "The driver's position on the policy, in the order drivers were added (1 is the first). Removed drivers keep their number."
driver_role = "`Named Insured`, `Spouse`, `Other Adult` or `Child`, as the record stands now. When a named insured dies, the surviving spouse becomes `Named Insured`, so a policy can list two; `policy.named_insured_driver_id` gives the current one."
first_name = "First name."
last_name = "Surname. Household members usually share the named insured's surname; other adults and some spouses have their own."
date_of_birth = "Date of birth."
gender = "`M` or `F`."
marital_status = "`M` married, `S` single, `D` divorced or `W` widowed, as the record stands now. It changes with marriage, divorce or a spouse's death; `exposure.rated_married` has the status each term was rated with."
license_state = "State that issued the driver's license. Always `IL`."
license_number_masked = "Masked driver's license number: the first letter of the last name and three final digits, for example `M***-****-*725`."
date_first_licensed = "Date the driver was first licensed. For a newly licensed teenager added mid-term it equals `added_date`."
added_date = "Date the driver joined the policy. For policies in force on January 1, 2022 it can be decades earlier (at inception or when the driver was licensed); for new business it is the first effective date."
removed_date = "Date the driver left the policy. Blank if the driver was still listed on the valuation date. Drivers are not removed when the policy itself ends, so check `policy.policy_status` as well."
removal_reason = "Why the driver left: `Moved Out`, `Divorce` or `Deceased`. Blank when `removed_date` is blank."
good_student = "`Y` if the driver qualified for the good-student discount (B grades, in full-time school, under 25) on the day they were added, otherwise `N`. Not updated later; `exposure.rated_good_student` has the status each term was rated with."
miles_to_work = "One-way commute distance by car, in whole miles. `0` for drivers who do not drive to work."
prior_violations = "Traffic violations dated in the three years before the driver was added and known to the insurer by then. Usually 0 for drivers added long before 2022, because incident histories start three years before the policy's first term in the data."
prior_accidents = "At-fault accidents dated in the three years before the driver was added and known to the insurer by then. Usually 0 for drivers added long before 2022, for the same reason as `prior_violations`."
sr22_filed_date = "Date of the driver's latest SR-22 filing (proof of insurance the state requires after a conviction for DUI, driving while suspended or leaving the scene), made within about a week after the conviction reached the driving record, or after the driver joined if later. Blank if none."
sr22_end_date = "Date the latest SR-22 filing ends, three years after the conviction reached the driving record. It can be after the valuation date. Blank if there is no filing."

[driver_incident]
grain = "Violation or at-fault accident"
summary = """One row per traffic violation or at-fault accident on a driver's record that the insurer knew of by the valuation date, starting three years before the policy's first term in the data, or three years before the driver joined for drivers added later. Violations come from the motor vehicle record, earlier accidents from claims-history reports or the company's pre-2022 claims, and later accidents from the company's own claims. Rating uses an incident only from its `known_date`, which can be months after `incident_date`."""

[driver_incident.columns]
incident_id = "Primary key."
driver_id = "The driver the incident is charged to."
incident_date = "Date of the violation or accident."
known_date = "Date the insurer learned of the incident: for a violation, when the conviction posted to the driving record (about two months on average); for an earlier accident, when it reached a claims-history report; for a company claim, the day after the payment that brought it to $1,000."
conviction_date = "Date of the court conviction for a violation, a few days to two weeks before `known_date`, on a business day. Blank for accidents."
incident_type = "`Minor Violation`, `Major Violation` or `At-Fault Accident`."
description = "What happened. Violations name the offense, such as `Speeding 1-14 mph over` or `Failure to yield` (minor) and `DUI` or `Driving while suspended` (major). Accidents read `At-fault accident (prior carrier)`, `At-fault accident (company claim before the extract)` or `At-fault accident (company claim)`."
source = "Where the record came from: `Motor Vehicle Record` (violations), `Prior Carrier Report` (accidents dated before the policy was first written), `Company Claim (Before Extract)` (later accidents with no claim row, mostly the company's own claims before 2022) or `Company Claim`."
claim_id = "The company's claim for the accident. Filled only when `source` is `Company Claim`; at-fault claims enter this table only once their property damage, bodily injury and collision payments reach $1,000."

[telematics_enrollment]
grain = "Enrollment of a policy in the telematics program"
summary = """One row per enrollment of a policy in Lakefront DriveCheck, the company's voluntary usage-based insurance program; a policy that leaves and rejoins later has more than one row. Enrollment covers every car on the policy and earns a 5% participation discount at once and a score-based discount from the next renewal (see `telematics_score`). Opt-ins whose term had not started by the valuation date, or whose renewal never took effect, are not included."""

[telematics_enrollment.columns]
enrollment_id = "Primary key."
policy_id = "The enrolled policy."
program = "Program name. Always `Lakefront DriveCheck`."
device_type = "How driving is recorded: `Mobile App`, `Plug-in Device` or `Bluetooth Beacon` (a windshield beacon). The app's share rises over time."
enrollment_date = "The date the enrollment took effect: the effective date of the new-business or renewal term the customer opted in with, not the day they said yes. Policies already enrolled on January 1, 2022 show an earlier date."
participation_discount_pct = "Discount in percent given from enrollment until the policy's first scored renewal. Always `5`."
end_date = "Date the enrollment ended. Blank if it was still active on the valuation date."
end_reason = "`Opted Out` (the customer left the program, more often after poor scores), `Policy Ended` (not renewed; `end_date` is the expiration date) or `Policy Canceled` (`end_date` is the cancellation date). Blank while active."

[telematics_score]
grain = "Vehicle, driver and scoring period"
summary = """One row per scored stretch of driving: an enrolled vehicle, the driver assigned to it, and the period since its last score. Scores are calculated on each policy's rating date, and a period is split where the car's assigned driver changed, so one car can have several rows for one rating date. The car's discount for the next term (`exposure.telematics_discount_pct`) is the day-weighted average of those rows' earned discounts, or 5% if none was scored."""

[telematics_score.columns]
score_id = "Primary key."
enrollment_id = "The enrollment the vehicle was monitored under."
policy_id = "The enrolled policy."
insured_vehicle_id = "The vehicle monitored."
driver_id = "The driver assigned to the vehicle during the period (its rated driver on the exposure rows)."
period_start_date = "Start of the period: the previous scoring date or the start of monitoring, moved later if the car or this driver joined the policy afterward; a change of assigned driver starts a new period. Can be before 2022 for early enrollments."
period_end_date = "End of the period: the rating date on which the score was calculated, or the day the customer left the program if earlier."
days_monitored = "Length of the period in days (`period_end_date` minus `period_start_date`). Periods under 45 days get no score."
trips = "Number of trips recorded in the period."
miles_driven = "Miles recorded in the period, to the nearest mile. The device measures actual driving, which the customer-reported `insured_vehicle.annual_mileage` usually understates."
hard_brakes_per_100_miles = "Hard-braking events per 100 miles driven."
rapid_accelerations_per_100_miles = "Rapid accelerations per 100 miles driven."
speeding_pct = "Percent of driving (0 to 100) well over the speed limit."
phone_use_minutes_per_100_miles = "Minutes of phone handling while driving per 100 miles."
night_driving_pct = "Percent of driving (0 to 100) done late at night."
driving_score = "Driving score from 1 to 100 (higher is safer), from braking, acceleration, speeding, phone use, night driving and annual mileage. Blank when the period was under 45 days."
earned_discount_pct = "Discount in percent (0 to 30) the score earns: none at 45 or below, rising evenly to 30 at 95 and above. `0` whatever the score if the customer left the program during the period. Blank when there is no score."
applied_to_policy_term_id = "The policy term the discount applies to: the term being rated when the score was calculated. Blank when the customer left the program, the car left the policy before that term began, or the policy did not renew into a term by the valuation date."
